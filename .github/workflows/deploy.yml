name: Deploy Slidev Decks to GitHub Pages

on:
  push:
    branches: [ main ] # Or 'master', depending on your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Runs before the builds because both need to know where the site will be
      # served. This reads the repo's live Pages settings, so base_path is
      # "/UnpackThePCAP" on the github.io URL and "" once a custom domain is
      # set -- meaning switching domains needs no change in this file.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build All Decks
        run: |
          mkdir -p dist
          for dir in episodes/*/; do
            deck_name=$(basename "$dir")
            echo "Building deck: $deck_name"
            npx slidev build "$dir/slides.md" \
              --base "${{ steps.pages.outputs.base_path }}/$deck_name/" \
              --out "${GITHUB_WORKSPACE}/dist/$deck_name"
          done

      # Writes dist/index.html: the site root, listing every episode found in
      # episodes/. Without this, the root URL is a 404 and only the per-deck
      # subdirectories are reachable.
      - name: Build Landing Page
        run: python3 tools/build_landing.py --out dist --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4